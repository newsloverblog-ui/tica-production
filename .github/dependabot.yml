version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      compatible-backend-updates:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - backend

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      compatible-frontend-updates:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend
