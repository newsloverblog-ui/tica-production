name: Browser QA

# Route x role sweep and edge cases in a real browser at 1440 and 390 wide.
# Screenshots land in tests/screenshots and are uploaded as the
# "ui-screenshots" artifact; the HTML report as "playwright-report".
on:
  push:
    branches: ['organiser-redesign', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_DATABASE: tica_qa
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8000
      ASSET_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tica_qa
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_DRIVER: file
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      # Throwaway password for throwaway accounts in a throwaway database.
      QA_PASSWORD: qa-only-Passw0rd-not-a-secret
      QA_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Prepare application and QA accounts
        run: |
          cp .env.example .env
          sed -i '/^LARAVEL_STORAGE_PATH=/d' .env
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
          php artisan key:generate --force
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root tica_qa < database/evento_v2.0.sql
          php artisan migrate --force --no-interaction
          php artisan tica:qa-seed

      - name: Start the app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/login && break; sleep 1; done

      - name: Run browser QA
        run: npx playwright test

      - name: Show server errors
        if: always()
        run: |
          tail -n 200 storage/logs/laravel.log 2>/dev/null || true
          tail -n 50 storage/logs/serve.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/screenshots/*.png
          if-no-files-found: warn

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: storage/playwright-report
          if-no-files-found: ignore
