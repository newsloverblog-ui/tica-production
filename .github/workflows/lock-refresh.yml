name: Refresh composer.lock (temporary)

# One-off: the dev environment can't reach Packagist, so the lock file is
# refreshed here and downloaded as an artifact. Remove after use.
on:
  push:
    branches: ['organiser-redesign']
    paths: ['.github/workflows/lock-refresh.yml']

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pcntl, pdo_mysql, redis, simplexml, zip
          coverage: none
          tools: composer:v2
      - run: composer update laravel/framework --with-dependencies --no-interaction --no-scripts --no-install
      - run: composer audit --locked --abandoned=fail --no-interaction
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock
