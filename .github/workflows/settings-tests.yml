name: Organiser settings tests

# Runs the tests for organiser settings, team roles, payouts and 2FA without
# the legacy MySQL baseline. These tests build their own in-memory SQLite
# tables, so they run even while the main workflow can't load its baseline.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: settings-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, simplexml, zip
          coverage: none
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
          cp .env.example .env
          sed -i '/^LARAVEL_STORAGE_PATH=/d' .env
          php artisan key:generate --force

      - name: Run organiser settings, team, payout and 2FA tests
        run: >-
          php artisan test
          tests/Unit/TeamPermissionMatrixTest.php
          tests/Unit/TicaTeamAccessRevocationTest.php
          tests/Unit/OrganizerAvatarAndProfileTest.php
